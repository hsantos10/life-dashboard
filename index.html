const fmtDate   = (d) => d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });

// ── Async storage (window.storage → localStorage fallback) ────
async function loadState() {
  try { if (window.storage) { const r = await window.storage.get(STORAGE_KEY); if (r) return JSON.parse(r.value); } } catch {}
  try { const v = localStorage.getItem(STORAGE_KEY); if (v) return JSON.parse(v); } catch {}
  return null;
}
async function saveState(data) {
  const j = JSON.stringify(data);
  try { if (window.storage) { await window.storage.set(STORAGE_KEY, j); return; } } catch {}
  try { localStorage.setItem(STORAGE_KEY, j); } catch {}
}

function buildUserMessage(cards, dailyNote) {
  const ml    = loadML();
  const meals = getTodayMeals();
  const doneML  = ML_TOPICS.filter(t => ml[t.id]?.status === 'done').length;
  const activeML = ML_TOPICS.find(t => ml[t.id]?.status === 'active');

  let msg = `Date: ${todayStr()} (${dayName()})\nTime: ${fmtTime(new Date())}\n`;
  msg += `Yesterday: ${dailyNote?.trim() || '(no note — reflect on what happened)'}\n\n`;
  msg += `=== DASHBOARD STATE ===\n\n`;

  cards.forEach(c => {
    const ago = daysAgo(c.lastUpdated);
    const staleMark = ago >= 7 ? ` ⚠️ STALE ${ago}d` : ago === 0 ? ' (today)' : ` (${ago}d ago)`;
    msg += `[${c.status.toUpperCase()} | ${c.priority} Priority${staleMark}] ${c.icon} ${c.title}\n`;
    c.notes.forEach(n => msg += `  • ${n}\n`);
    msg += '\n';
  });

  msg += `=== ML SYSTEMS ROADMAP ===\n`;
  msg += `Progress: ${doneML}/6 topics complete. `;
  msg += activeML ? `Active now: ${activeML.title} (${activeML.week}).` : 'No active topic set.';
  msg += '\n';
  ML_TOPICS.forEach(t => {
    const s = ml[t.id]?.status || 'none';
    msg += `  ${s==='done'?'✅':s==='active'?'🔄':'⬜'} ${t.title} (${t.week})\n`;
  });

  msg += `\n=== TODAY'S MEAL PLAN (Sam's Club, ${meals.cal} cal) ===\n`;
  meals.meals.forEach(m => msg += `  ${m.slot}: ${m.name} · ${m.cal} · ${m.macro}\n`);

  msg += '\nGive me my morning debrief.';
  return msg;
}

// ── Markdown export for Obsidian ──────────────────────────────
function genMarkdown(cards, dailyNote, debrief) {
  const ml    = loadML();
  const meals = getTodayMeals();
  let md = `---\ndate: ${todayStr()}\nday: ${dayName()}\ntags: [dashboard, daily-note]\n---\n\n`;
  md += `# Morning Dashboard — ${todayStr()} (${dayName()})\n\n`;

  if (dailyNote?.trim()) md += `## Yesterday\n> ${dailyNote.trim()}\n\n`;
  if (debrief?.trim())   md += `## AI Morning Debrief\n${debrief.trim()}\n\n`;

  md += `## Life Areas\n\n`;
  cards.forEach(c => {
    const ago = daysAgo(c.lastUpdated);
    md += `### ${c.icon} ${c.title}\n`;
    md += `**Status:** ${c.status} · **Priority:** ${c.priority} · **Last updated:** ${c.lastUpdated} (${ago === 0 ? 'today' : ago+'d ago'})\n\n`;
    c.notes.forEach(n => md += `- ${n}\n`);
    md += '\n';
  });

  md += `## Meals Today (${meals.cal} cal)\n\n`;
  meals.meals.forEach(m => md += `- **${m.slot}** — ${m.name} · ${m.cal} · \`${m.macro}\`\n`);

  md += `\n## ML Systems Roadmap\n\n`;
  ML_TOPICS.forEach(t => {
    const s = ml[t.id]?.status || 'none';
    md += `- ${s==='done'?'✅':s==='active'?'🔄':'⬜'} ${t.icon} **${t.title}** (${t.week})\n`;
    if (ml[t.id]?.notes) md += `  > ${ml[t.id].notes}\n`;
  });

  return md;
}

// ── Parse debrief markdown into renderable sections ───────────
function parseDebrief(text) {
  const sections = [];
  let cur = null;
  text.split('\n').forEach(line => {
    if (line.startsWith('## ')) {
      if (cur) sections.push(cur);
      cur = { header: line.slice(3).trim(), lines: [] };
    } else if (cur) {
      cur.lines.push(line);
    }
  });
  if (cur) sections.push(cur);
  return sections;
}

function DebriefPanel({ cards, dailyNote, debrief, setDebrief }) {
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState('');

  const run = async () => {
    setLoading(true); setError(''); setDebrief('');
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: buildSystemPrompt(),
          messages: [{ role:'user', content: buildUserMessage(cards, dailyNote) }],
        }),
      });
      const data = await res.json();
      if (data.error) setError(data.error.message);
      else setDebrief(data.content?.[0]?.text || '');
    } catch {
      setError('Network error — check connection or API key environment.');
    }
    setLoading(false);
  };

  const sections = debrief ? parseDebrief(debrief) : [];

  return (
    <div className="bg-slate-800 rounded-xl border border-slate-700 p-4 space-y-4">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div>
          <div className="flex items-center gap-2">
            <span className="text-sm">☀️</span>
            <span className="text-xs font-semibold text-slate-400 uppercase tracking-widest">Morning Debrief</span>
          </div>
          <div className="text-xs text-slate-600 mt-0.5">AI brief based on your current dashboard state + daily note</div>
        </div>
        <button
          onClick={run}
          disabled={loading}
          className="flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-semibold transition-colors shrink-0"
        >
          {loading
            ? <><div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full spin" />Generating…</>
            : '☀️ Good Morning'}
        </button>
      </div>

      {error && (
        <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-3 text-xs text-red-400 leading-relaxed">{error}</div>
      )}

      {sections.length > 0 && (
        <div className="space-y-3 fade-in">
          {sections.map((s, i) => {
            const emoji  = [...s.header].find(c => c.match(/\p{Emoji}/u));
            const style  = SECTION_ACCENT[emoji] || { left:'border-l-slate-600', bg:'bg-slate-700/20', head:'text-slate-300' };
            const body   = s.lines.filter(l => l.trim());
            return (
              <div key={i} className={`border-l-4 ${style.left} ${style.bg} rounded-r-xl pl-4 pr-4 py-3`}>
                <div className={`text-sm font-bold mb-2 ${style.head}`}>{s.header}</div>
                <div className="space-y-1">
                  {body.map((line, j) => {
                    const isNum     = /^\d+\./.test(line.trim());
                    const isBullet  = /^[-*]/.test(line.trim());
                    return (
                      <div key={j} className={`text-sm leading-relaxed ${isNum ? 'text-slate-200 font-medium' : 'text-slate-300'}`}>
                        {line}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {!debrief && !loading && !error && (
        <div className="text-center py-8 text-slate-600 text-sm">
          Fill in yesterday's note, then hit <span className="text-slate-400">"Good Morning"</span> for your AI brief
        </div>
      )}
    </div>
  );
}

          const s = mlData[t.id]?.status || 'none';
          return (
            <div key={t.id} className="flex items-center gap-2">
              <span className="text-xs w-4 shrink-0">{s==='done'?'✅':s==='active'?'🔄':'⬜'}</span>
              <span className={`text-xs ${s==='done'?'text-slate-500 line-through':s==='active'?'text-violet-300 font-medium':'text-slate-500'}`}>
                {t.icon} {t.title}
              </span>
              <span className="text-xs text-slate-700 ml-auto shrink-0">{t.week}</span>
            </div>
          );
        })}
      </div>
      <a
        href="https://hsantos10.github.io/personal-tracker/"
        target="_blank"
        className="mt-3 flex items-center gap-1 text-xs text-violet-500 hover:text-violet-400 transition-colors"
      >
        Open ML tracker →
      </a>
    </div>
  );
}

// ── Individual life area card ─────────────────────────────────
function LifeCard({ card, onUpdate }) {
  const [editing, setEditing] = useState(false);
  const [draft,   setDraft]   = useState(null);
  const ago   = daysAgo(card.lastUpdated);
  const stale = ago >= 7;

  const startEdit = () => { setDraft({ ...card, notes: [...card.notes] }); setEditing(true); };
  const cancel    = () => { setEditing(false); setDraft(null); };
  const save      = () => { onUpdate(card.id, draft); setEditing(false); setDraft(null); };

  const cycleStatus = () => {
    const i = STATUS_OPTS.indexOf(card.status);
    onUpdate(card.id, { status: STATUS_OPTS[(i + 1) % STATUS_OPTS.length] });
  };

  const updateNote  = (i, v) => { const n = [...draft.notes]; n[i] = v; setDraft({ ...draft, notes: n }); };
  const addNote     = () => { if (draft.notes.length < 4) setDraft({ ...draft, notes: [...draft.notes, ''] }); };
  const removeNote  = (i) => setDraft({ ...draft, notes: draft.notes.filter((_, j) => j !== i) });

  return (
    <div
      className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden hover:border-slate-600 transition-all duration-200 flex flex-col"
      style={{ borderTopColor: card.color, borderTopWidth: '3px' }}
    >
      <div className="p-4 flex flex-col gap-3 flex-1">
        {/* Card header */}
        <div className="flex items-start justify-between gap-2">
          <div className="flex items-center gap-2.5 min-w-0">
            <span className="text-xl shrink-0">{card.icon}</span>
            <div className="min-w-0">
              <div className="text-sm font-bold text-slate-100 leading-tight">{card.title}</div>
              <div className={`text-xs mt-0.5 font-medium ${PRIORITY_STYLE[card.priority]}`}>⚑ {card.priority}</div>
            </div>
          </div>
          <button
            onClick={editing ? cancel : startEdit}
            className="text-xs text-slate-600 hover:text-slate-300 transition-colors shrink-0 px-2 py-1 rounded-md hover:bg-slate-700/70"
          >
            {editing ? 'Cancel' : 'Edit'}
          </button>
        </div>

        {!editing && (
          <>
            {/* Status + staleness */}
            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={cycleStatus}
                title="Click to cycle status"
                className={`text-xs px-2.5 py-0.5 rounded-full font-semibold transition-all ${STATUS_STYLE[card.status]}`}
              >
                {card.status}
              </button>
              <span className={`text-xs ml-auto ${stale ? 'text-amber-600' : 'text-slate-600'}`}>
                {stale ? `⚠ ${ago}d stale` : ago === 0 ? 'Updated today' : `${ago}d ago`}
              </span>
            </div>

            {/* Notes */}
            <ul className="space-y-1.5 flex-1">
              {card.notes.map((n, i) => (
                <li key={i} className="flex gap-2 text-xs text-slate-400 leading-snug">
                  <span className="text-slate-700 shrink-0 mt-0.5">•</span>
                  <span>{n}</span>
                </li>
              ))}
            </ul>
          </>
        )}

        {editing && draft && (
          <div className="space-y-3 fade-in">
            <div className="grid grid-cols-2 gap-2">
              <div>
                <div className="text-xs text-slate-500 mb-1">Status</div>
                <select
                  value={draft.status}
                  onChange={e => setDraft({ ...draft, status: e.target.value })}
                  className="w-full bg-slate-900 text-slate-200 text-xs rounded-lg px-2.5 py-1.5 border border-slate-600 focus:border-slate-400 transition-colors"
                >
                  {STATUS_OPTS.map(s => <option key={s}>{s}</option>)}
                </select>
              </div>
              <div>
                <div className="text-xs text-slate-500 mb-1">Priority</div>
                <select
                  value={draft.priority}
                  onChange={e => setDraft({ ...draft, priority: e.target.value })}
                  className="w-full bg-slate-900 text-slate-200 text-xs rounded-lg px-2.5 py-1.5 border border-slate-600 focus:border-slate-400 transition-colors"
                >
                  {['High','Medium','Low'].map(p => <option key={p}>{p}</option>)}
                </select>
              </div>
            </div>

            <div>
              <div className="text-xs text-slate-500 mb-1.5">Notes (max 4)</div>
              <div className="space-y-1.5">
                {draft.notes.map((n, i) => (
                  <div key={i} className="flex gap-1.5">
                    <textarea
                      value={n}
                      onChange={e => updateNote(i, e.target.value)}
                      rows={1}
                      className="flex-1 bg-slate-900 text-slate-200 text-xs rounded-lg px-2.5 py-1.5 border border-slate-600 focus:border-slate-400 resize-none transition-colors"
                    />
                    <button
                      onClick={() => removeNote(i)}
                      className="text-slate-600 hover:text-red-400 transition-colors px-1 text-base leading-none self-start pt-1.5"
                    >×</button>
                  </div>
                ))}
                {draft.notes.length < 4 && (
                  <button onClick={addNote} className="text-xs text-slate-600 hover:text-slate-400 transition-colors">
                    + add note
                  </button>
                )}
              </div>
            </div>

            <div className="flex gap-2">
              <button onClick={save}   className="flex-1 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition-colors">Save</button>
              <button onClick={cancel} className="flex-1 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs transition-colors">Cancel</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Obsidian Vault Sync ───────────────────────────────────────
function ObsidianSync({ cards, dailyNote, debrief }) {
  const [syncStatus,  setSyncStatus]  = useState('');
  const [hasVault,    setHasVault]    = useState(false);
  const dirRef = useRef(null);
  const fsaSupported = typeof window.showDirectoryPicker === 'function';

  const syncToVault = async () => {
    setSyncStatus('');
    try {
      if (!dirRef.current) {
        dirRef.current = await window.showDirectoryPicker({ mode: 'readwrite' });
        setHasVault(true);
      }
      const perm = await dirRef.current.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') { setSyncStatus('❌ Permission denied'); return; }

      const fname   = `Dashboard-${todayStr()}.md`;
      const content = genMarkdown(cards, dailyNote, debrief);
      const fh      = await dirRef.current.getFileHandle(fname, { create: true });
      const w       = await fh.createWritable();
      await w.write(content);
      await w.close();
      setSyncStatus(`✅ Synced → ${fname}`);
    } catch (e) {
      if (e.name !== 'AbortError') setSyncStatus('❌ Sync failed — try again');
    }
  };

  const downloadMd = () => {
    const content = genMarkdown(cards, dailyNote, debrief);
    const blob    = new Blob([content], { type: 'text/markdown;charset=utf-8' });
    const url     = URL.createObjectURL(blob);
    const a       = document.createElement('a');
    a.href     = url;
    a.download = `Dashboard-${todayStr()}.md`;
    a.click();
    URL.revokeObjectURL(url);
    setSyncStatus('📥 Downloaded');
    setTimeout(() => setSyncStatus(''), 3000);
  };

  return (
    <div className="bg-slate-800 rounded-xl border border-slate-700 p-4 flex flex-wrap items-center gap-3">
      <div className="flex items-center gap-2 flex-1 min-w-0">
        <span className="text-lg">📂</span>
        <div className="min-w-0">
          <div className="text-xs font-semibold text-slate-400 uppercase tracking-widest">Obsidian Vault Sync</div>
          <div className="text-xs text-slate-600 truncate">
            {hasVault ? 'Vault connected — click to write today\'s note' : 'Exports full dashboard as a daily note .md file'}
          </div>
        </div>
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        {syncStatus && <span className="text-xs text-slate-400">{syncStatus}</span>}
        {fsaSupported && (
          <button
            onClick={syncToVault}
            className="px-3 py-1.5 rounded-lg bg-teal-700 hover:bg-teal-600 active:bg-teal-800 text-white text-xs font-semibold transition-colors"
          >
            {hasVault ? '📂 Sync Now' : '📂 Set Vault & Sync'}
          </button>
        )}
        <button
          onClick={downloadMd}
          className="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs transition-colors"
        >
          📥 Download .md
        </button>
      </div>
    </div>
  );
}

// ── Quick stats bar ───────────────────────────────────────────
function StatsBar({ cards }) {
  const active  = cards.filter(c => c.status === 'Active').length;
  const blocked = cards.filter(c => c.status === 'Blocked').length;
  const stale   = cards.filter(c => daysAgo(c.lastUpdated) >= 7).length;
  const high    = cards.filter(c => c.priority === 'High' && c.status !== 'Done').length;
  return (
    <div className="flex flex-wrap gap-2 mb-4">
      {[
        { label:'Active',    val:active,  color:'text-emerald-400', bg:'bg-emerald-500/10 border-emerald-500/20' },
        { label:'Blocked',   val:blocked, color:'text-red-400',     bg:'bg-red-500/10 border-red-500/20' },
        { label:'High Pri',  val:high,    color:'text-amber-400',   bg:'bg-amber-500/10 border-amber-500/20' },
        { label:'Stale 7d+', val:stale,   color:'text-slate-400',   bg:'bg-slate-700/50 border-slate-600/40' },
      ].map(s => (
        <div key={s.label} className={`flex items-center gap-1.5 text-xs px-3 py-1 rounded-full border ${s.bg}`}>
          <span className={`font-bold text-sm ${s.color}`}>{s.val}</span>
          <span className="text-slate-500">{s.label}</span>
        </div>
      ))}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════════════════════
function App() {
  const [cards,     setCards]     = useState(INITIAL_CARDS);
  const [dailyNote, setDailyNote] = useState('');
  const [debrief,   setDebrief]   = useState('');
  const [time,      setTime]      = useState(new Date());
  const [loaded,    setLoaded]    = useState(false);

  // Load persisted state
  useEffect(() => {
    loadState().then(s => {
      if (s?.cards)     setCards(s.cards);
      if (s?.dailyNote !== undefined) setDailyNote(s.dailyNote);
      if (s?.debrief)   setDebrief(s.debrief);
      setLoaded(true);
    });
  }, []);

  // Persist on change
  useEffect(() => {
    if (loaded) saveState({ cards, dailyNote, debrief });
  }, [cards, dailyNote, debrief, loaded]);

  // Live clock (updates every 30s)
  useEffect(() => {
    const t = setInterval(() => setTime(new Date()), 30000);
    return () => clearInterval(t);
  }, []);

  const updateCard = useCallback((id, updates) => {
    setCards(prev => prev.map(c =>
      c.id === id ? { ...c, ...updates, lastUpdated: todayStr() } : c
    ));
  }, []);

  return (
    <div className="min-h-screen bg-slate-900 text-slate-100">
      <Header time={time} />

      <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">

        {/* Top row: debrief + daily note (left) | meal plan + ML (right) */}
        <div className="grid grid-cols-1 xl:grid-cols-3 gap-4">
          <div className="xl:col-span-2 space-y-4">
            <DailyNote value={dailyNote} onChange={setDailyNote} />
            <DebriefPanel cards={cards} dailyNote={dailyNote} debrief={debrief} setDebrief={setDebrief} />
          </div>
          <div className="space-y-4">
            <MealSummary />
            <MLProgressSummary />
          </div>
        </div>

        {/* Life area cards */}
        <div>
          <div className="flex items-center gap-3 mb-3">
            <div className="text-xs font-semibold text-slate-500 uppercase tracking-widest">Life Areas</div>
            <div className="flex-1 h-px bg-slate-800" />
          </div>
          <StatsBar cards={cards} />
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
            {cards.map(c => <LifeCard key={c.id} card={c} onUpdate={updateCard} />)}
          </div>
        </div>

        {/* Obsidian sync footer */}
        <ObsidianSync cards={cards} dailyNote={dailyNote} debrief={debrief} />

        <div className="text-center text-xs text-slate-700 pb-4">
          David Santos · EE PhD · Texas A&M · All data stored locally
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
